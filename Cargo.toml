[package]
name = "skeg-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/skegdb/skeg-client-rs"
homepage = "https://github.com/skegdb/skeg-client-rs"
authors = ["skeg contributors"]
description = "Rust client for skeg (binary protocol)"
keywords = ["vector-database", "skeg", "client"]
categories = ["database", "api-bindings"]

[dependencies]
# Keep this repo independently buildable in CI and downstream clones.
skeg-proto = "0.2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
socket2 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Reads the shared conformance case files. Test-only: the client itself
# stays dependency-light.
serde_json = "1"

[lints.clippy]
uninlined_format_args = "allow"
manual_is_multiple_of = "allow"
